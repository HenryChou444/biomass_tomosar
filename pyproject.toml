[project]
name = "biomass-tomosar"
version = "0.1.0"
description = "Notebook-first BIOMASS TomoSAR research project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipympl>=0.9.4",
    "matplotlib>=3.9",
    "numpy==1.26.4",
    "scipy==1.16.3",
    "tqdm>=4.66",
    "netCDF4>=1.6",
    "lxml>=5.0",
    "gdal[numpy]==3.8.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbstripout>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomass_tomosar"]

[tool.uv.extra-build-dependencies]
gdal = ["numpy==1.26.4"]
